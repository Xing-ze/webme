<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 背景渐变 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装饰圆光 -->
  <circle cx="1050" cy="100" r="180" fill="#667eea" opacity="0.18"/>
  <circle cx="100" cy="530" r="140" fill="#f093fb" opacity="0.15"/>
  <circle cx="900" cy="500" r="90" fill="#06b6d4" opacity="0.12"/>
  <!-- 左上角大号标题 -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="92" font-weight="900" fill="white" filter="url(#glow)">
      🌱 WebMe
    </text>
    <rect x="0" y="36" width="240" height="6" rx="3" fill="url(#accent)"/>
  </g>
  <!-- 右上副标题 -->
  <g transform="translate(80, 250)">
    <text x="0" y="0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="44" font-weight="700" fill="#e0e7ff">
      Xing-ze · 个人数字空间
    </text>
  </g>
  <!-- 分割线 -->
  <line x1="80" y1="310" x2="1120" y2="310" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- 4 个亮点 bullet -->
  <g transform="translate(80, 380)" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="30" fill="#f1f5f9">
    <g transform="translate(0, 0)">
      <circle cx="16" cy="-10" r="6" fill="#667eea"/>
      <text x="44" y="0" font-weight="600">🏠 个人主页</text>
    </g>
    <g transform="translate(320, 0)">
      <circle cx="16" cy="-10" r="6" fill="#f093fb"/>
      <text x="44" y="0" font-weight="600">📚 本地知识库</text>
    </g>
    <g transform="translate(0, 72)">
      <circle cx="16" cy="-10" r="6" fill="#06b6d4"/>
      <text x="44" y="0" font-weight="600">🎬 B 站追番墙</text>
    </g>
    <g transform="translate(320, 72)">
      <circle cx="16" cy="-10" r="6" fill="#22c55e"/>
      <text x="44" y="0" font-weight="600">🎵 网易云音乐年度报告</text>
    </g>
  </g>
  <!-- 底部小字 -->
  <g transform="translate(80, 560)" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="0" y="0" font-size="22" fill="#94a3b8" font-weight="500">
      4 款主题切换 · 苹果设计语言 · 交互动画细腻
    </text>
    <text x="1120" y="0" font-size="20" fill="#94a3b8" font-weight="600" text-anchor="end">
      webme-nine.vercel.app
    </text>
  </g>
</svg>
